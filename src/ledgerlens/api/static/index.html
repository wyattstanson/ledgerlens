<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LedgerLens</title>
  <meta name="description" content="Governed analytics for FP&amp;A, interview quality and rate cards. Every number carries lineage. Synthetic data.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css" integrity="sha384-GzhNOdwUkh38xzoNEY1vRdLr+w8q+bXEJsd/km6Ef61w1Kfk+lself6cn14ilrpO" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="app">
  <div class="grain" aria-hidden="true"></div>

  <!-- The window's title bar. Not a navigation bar: it names the window and carries its three
       controls, each of which does something. Navigation is the rail, on the left. -->
  <div class="titlebar">
    <div class="lights">
      <button type="button" class="light light--close" id="light-close" title="Leave the workspace">
        <span class="sr-only">Leave the workspace</span>
      </button>
      <button type="button" class="light light--min" id="light-min" title="Collapse the sidebar">
        <span class="sr-only">Collapse the sidebar</span>
      </button>
      <button type="button" class="light light--zoom" id="light-zoom" title="Fill the screen">
        <span class="sr-only">Fill the screen</span>
      </button>
    </div>
    <p class="titlebar-name"><b id="titlebar-page">FP&amp;A</b><span>LedgerLens</span></p>
  </div>

  <!-- Navigation sits on the left and stays put while the work scrolls. -->
  <nav class="rail" aria-label="Workspace">
    <div class="rail-head">
      <a class="brand" href="#/fpa">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-word">LedgerLens</span>
      </a>
      <button type="button" class="rail-dock" id="rail-dock" aria-expanded="true" aria-controls="rail-nav-packs"
              title="Collapse the sidebar">
        <i class="ph-light ph-sidebar-simple" aria-hidden="true"></i>
        <span class="sr-only">Collapse the sidebar</span>
      </button>
    </div>

    <p class="rail-group">Packs</p>
    <ul class="rail-nav" id="rail-nav-packs">
      <li><a href="#/fpa" data-tab="fpa"><i class="ph-light ph-chart-line-up rail-icon" aria-hidden="true"></i><span class="rail-word">FP&amp;A</span></a></li>
      <li><a href="#/interviews" data-tab="interviews"><i class="ph-light ph-users rail-icon" aria-hidden="true"></i><span class="rail-word">Interviews</span></a></li>
      <li><a href="#/ratecards" data-tab="ratecards"><i class="ph-light ph-receipt rail-icon" aria-hidden="true"></i><span class="rail-word">Rate cards</span></a></li>
      <li><a href="#/yours" data-tab="yours"><i class="ph-light ph-sliders-horizontal rail-icon" aria-hidden="true"></i><span class="rail-word">Your numbers</span></a></li>
    </ul>

    <p class="rail-group">Governance</p>
    <ul class="rail-nav">
      <li><a href="#/approvals" data-tab="approvals"><i class="ph-light ph-stamp rail-icon" aria-hidden="true"></i><span class="rail-word">Approvals</span></a></li>
      <li><a href="#/audit" data-tab="audit"><i class="ph-light ph-list-magnifying-glass rail-icon" aria-hidden="true"></i><span class="rail-word">Audit and cost</span></a></li>
      <li><a href="#/method" data-tab="method"><i class="ph-light ph-function rail-icon" aria-hidden="true"></i><span class="rail-word">Method</span></a></li>
    </ul>

    <div class="rail-foot">
      <span id="footer-cost">Model spend: loading</span>
      <span>All data is synthetic, generated from a fixed seed.</span>
    </div>
  </nav>

  <div class="workspace">
    <!-- The status strip: which warehouse is loaded, and what this deployment is allowed to do. -->
    <div class="workbar">
      <span class="scope-strip" id="footer-scope"></span>
      <span class="synthetic-tag">Synthetic data</span>
    </div>

    <main id="view" class="view" tabindex="-1">
      <div class="skeleton-page" aria-hidden="true">
        <span class="skeleton skeleton--title"></span>
        <span class="skeleton skeleton--line"></span>
        <span class="skeleton skeleton--card"></span>
      </div>
    </main>
  </div>

  <!-- Lineage drawer: opens from a number, shows the SQL and rows that produced it. -->
  <aside class="drawer" id="drawer" hidden aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h2 id="drawer-title">Where this number came from</h2>
      <button type="button" class="drawer-close" id="drawer-close" aria-label="Close">Close</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@4.1.2/plotly.min.js" integrity="sha384-hHv6D3tTUUBpp4tVv6t2Dc3oGuRhphmWOTKUR8jWyN0Pnon1g3iebKCNDNmKmxo8" crossorigin="anonymous"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
