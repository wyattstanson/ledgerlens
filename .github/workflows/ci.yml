name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DAGSTER_HOME: ${{ github.workspace }}/.dagster
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with: { enable-cache: true }
      - run: uv sync --locked --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: mkdir -p .dagster && make dbt-parse
      - run: uv run pytest -q --cov=ledgerlens --cov-fail-under=85
      # --allow-empty until Phase 2 adds the first golden set; remove it then so an empty run fails.
      - run: uv run python -m ledgerlens.core.evals.run --suite offline --allow-empty
