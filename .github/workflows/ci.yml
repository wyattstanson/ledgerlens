name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DAGSTER_HOME: ${{ github.workspace }}/.dagster
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with: { enable-cache: true }
      - run: uv sync --locked --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: mkdir -p .dagster && make dbt-parse
      - run: uv run pytest -q --cov=ledgerlens --cov-fail-under=85
      # Offline evals run the tools against a freshly built seed-42 warehouse. --simulate-review stands in
      # for the human title reviewer using the hidden truth (audited as simulated); demo and evals only.
      - run: uv run python -m ledgerlens.cli generate --seed 42
      - run: uv run python -m ledgerlens.cli pipeline ratecards --simulate-review
      - run: uv run python -m ledgerlens.core.evals.run --suite offline
