# Agent registry (BUILD_PROMPT section 9.1). The loop refuses any tool not listed for an agent.
# mandate: read_only | propose | write_with_approval
agents:
  - id: fpa.variance
    owner: fpa
    model_task: pack_agent
    mandate: read_only
    tools: [fpa.bridge, fpa.drivers, fpa.forecast]
    max_tool_calls: 8

  - id: ratecards.benchmark
    owner: procurement
    model_task: pack_agent
    mandate: read_only
    tools: [rc.benchmark, rc.vendor_rates, rc.vendor_scorecard, rc.leakage, rc.mapping_status]
    max_tool_calls: 8
  - id: ratecards.panel
    owner: procurement
    model_task: pack_agent
    mandate: propose
    tools: [rc.benchmark, rc.optimize_panel, rc.savings_bridge, rc.accept_panel]
    max_tool_calls: 8
  - id: ratecards.negotiation
    owner: procurement
    model_task: narrative
    mandate: propose
    tools: [rc.tail_plan, rc.benchmark, rc.vendor_rates]
    max_tool_calls: 8

  - id: interviews.observatory
    owner: talent
    model_task: pack_agent
    mandate: read_only
    tools: [iv.plan_status, iv.calibration, iv.interviewer_flags, iv.panel_agreement, iv.process_quality,
            iv.impact_ratios, iv.predictive_validity, iv.tagger_quality]
    max_tool_calls: 8
  - id: interviews.audit_drafter
    owner: legal_and_talent
    model_task: narrative
    mandate: propose
    tools: [iv.plan_status, iv.impact_ratios, iv.export_compliance_pack]
    max_tool_calls: 8
